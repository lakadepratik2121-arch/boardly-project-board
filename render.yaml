services:
  - type: web
    name: boardly
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: boardly
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
